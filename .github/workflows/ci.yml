name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  SERVER_DIR: server
  CLIENT_DIR: client

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            ${{ env.SERVER_DIR }}/package-lock.json
            ${{ env.CLIENT_DIR }}/package-lock.json

      - name: Install Server Dependencies
        run: npm ci
        working-directory: ${{ env.SERVER_DIR }}

      - name: Server TypeScript Check
        run: npx tsc --noEmit
        working-directory: ${{ env.SERVER_DIR }}

      - name: Install Client Dependencies
        run: npm ci
        working-directory: ${{ env.CLIENT_DIR }}

      - name: Client TypeScript Check
        run: npx tsc --noEmit
        working-directory: ${{ env.CLIENT_DIR }}

      - name: Client Lint
        run: npm run lint
        working-directory: ${{ env.CLIENT_DIR }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            ${{ env.SERVER_DIR }}/package-lock.json
            ${{ env.CLIENT_DIR }}/package-lock.json

      - name: Install Server Dependencies
        run: npm ci
        working-directory: ${{ env.SERVER_DIR }}

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ${{ env.SERVER_DIR }}

      - name: Build Server
        run: npm run build
        working-directory: ${{ env.SERVER_DIR }}

      - name: Install Client Dependencies
        run: npm ci
        working-directory: ${{ env.CLIENT_DIR }}

      - name: Build Client
        run: npm run build
        working-directory: ${{ env.CLIENT_DIR }}
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVER_DIR }}
          push: false
          tags: hm-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CLIENT_DIR }}
          push: false
          tags: hm-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
